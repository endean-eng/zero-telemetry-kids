name: Trigger Parent Portal Deploy (kids-deaninno-site)

on:
  push:
    branches: [main]
    # Optional: Ignore docs-only commits so ADR/README edits don't trigger unnecessary FTP deploys
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'roadmap.md'
      - 'AGENTS.md'

jobs:
  notify-kids-site:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to kids-deaninno-site
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/endean-eng/kids-deaninno-site/dispatches \
            -d '{"event_type":"ztk-updated","client_payload":{"sha":"${{ github.sha }}"}}'
