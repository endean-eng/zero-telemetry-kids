<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kids Commons" />
  <title>Zero-Telemetry Kids - Offline Preschool Commons</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg-sky: #f0f9ff;
      --bg-card: #ffffff;
      --ink-primary: #0f172a;
      --ink-muted: #475569;
      --barn-red: #dc2626;
      --tractor-green: #16a34a;
      --sun-amber: #f59e0b;
      --sky-blue: #2563eb;
      --plum-purple: #7c3aed;
      --border-soft: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-sky);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink-primary);
    }

    #app-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* OS-Aware Parent Install Banner */
    #install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.95rem;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    #install-banner.visible {
      display: flex;
    }

    .install-btn {
      background: var(--tractor-green);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .install-dismiss {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Launcher View */
    #launcher-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 18px 24px 36px 24px;
      overflow-y: auto;
      touch-action: pan-y;
    }

    .launcher-header {
      text-align: center;
      margin-bottom: 14px;
    }

    .launcher-header h1 {
      margin: 0 0 4px 0;
      font-size: clamp(1.35rem, 2.6vw, 2rem);
      color: var(--ink-primary);
    }

    .launcher-header p {
      margin: 0;
      font-size: 0.92rem;
      color: var(--ink-muted);
    }

    /* Top Hero Draft Section (1 Favorite + 1 Discovery Pick) */
    .hero-section {
      width: 100%;
      max-width: 880px;
      background: linear-gradient(180deg, #ffffff 0%, #fef9c3 100%);
      border: 4px solid var(--ink-primary);
      border-radius: 28px;
      padding: 16px 22px 20px 22px;
      margin-bottom: 22px;
      box-shadow: 0 8px 0 var(--ink-primary);
    }

    .hero-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--ink-primary);
    }

    .shuffle-picks-btn {
      min-height: 48px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--sun-amber);
      border: 3px solid var(--ink-primary);
      box-shadow: 0 4px 0 var(--ink-primary);
      font-size: 1rem;
      font-weight: 800;
      color: var(--ink-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .shuffle-picks-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink-primary);
    }

    #hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
    }

    /* Shared Game Card Base */
    .game-card {
      position: relative;
      background: var(--bg-card);
      border: 4px solid var(--border-soft);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .game-card:active {
      transform: scale(0.97);
    }

    .game-card.hero-card {
      min-height: 215px;
      padding: 28px 18px 18px 18px;
      border-width: 5px;
      box-shadow: 0 6px 0 var(--ink-primary);
      background: #ffffff;
    }

    .game-card.compact-card {
      min-height: 165px;
      padding: 26px 14px 14px 14px;
      gap: 6px;
    }

    /* Favorite Toggle Button (Top-Right of Card) */
    .fav-toggle-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: #f8fafc;
      border: 2.5px solid #cbd5e1;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      z-index: 15;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .fav-toggle-btn.is-fav {
      background: #fee2e2;
      border-color: #dc2626;
      color: #dc2626;
    }

    .fav-toggle-btn:active {
      transform: scale(0.88);
    }

    /* Hero Slot Badge (Top-Left of Card) */
    .slot-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      background: #f1f5f9;
      color: #334155;
      border: 2px solid #cbd5e1;
      z-index: 12;
    }

    .slot-badge.fav-slot {
      background: #fef3c7;
      color: #92400e;
      border-color: #f59e0b;
    }

    .game-card-icon {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
    }

    .compact-card .game-card-icon {
      width: 72px;
      height: 72px;
      margin-top: 4px;
    }

    .game-card-title {
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
      color: var(--ink-primary);
    }

    .compact-card .game-card-title {
      font-size: 1.05rem;
    }

    .game-card-category {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--ink-muted);
      background: #f1f5f9;
      padding: 3px 10px;
      border-radius: 999px;
      text-align: center;
      white-space: nowrap;
    }

    /* Bottom All-Games Library Section */
    .library-section {
      width: 100%;
      max-width: 880px;
    }

    .library-header {
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      margin: 0 0 12px 6px;
      text-align: center;
    }

    #game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      width: 100%;
    }

    /* Active Game Stage */
    #stage-view {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #stage-view.active {
      display: block;
    }

    #game-mount {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Dual-Corner Parent Gate Zones (96x96px minimum hitbox) */
    .parent-gate-corner {
      position: fixed;
      top: 0;
      width: 96px;
      height: 96px;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }

    .parent-gate-corner.left {
      left: 0;
    }

    .parent-gate-corner.right {
      right: 0;
    }

    .parent-gate-corner.holding {
      opacity: 1;
    }

    .gate-ring {
      width: 56px;
      height: 56px;
    }

    #parent-gate-hint {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 910;
    }

    #parent-gate-hint.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <!-- Smart OS-Aware Parent Install Banner -->
    <div id="install-banner" role="region" aria-label="Install App Prompt"></div>

    <!-- Main Game Launcher Grid -->
    <main id="launcher-view">
      <header class="launcher-header">
        <h1>Zero-Telemetry Kids</h1>
        <p>Tap a heart to favorite a game! Hold top corner (PC) or both corners (Touch) inside any game to exit.</p>
      </header>

      <!-- Top Roguelike Hero Draft: 1 Favorite + 1 Discovery Pick -->
      <section class="hero-section" aria-label="Featured Games">
        <div class="hero-header-bar">
          <div class="hero-title-group">
            <span>&#9733; Ready to Play (Pick 1!)</span>
          </div>
          <button type="button" class="shuffle-picks-btn" id="btn-shuffle-hero">
            <span>&#9861;</span>
            <span>Spin New Picks</span>
          </button>
        </div>
        <div id="hero-grid"></div>
      </section>

      <!-- Bottom Full Game Library -->
      <section class="library-section" aria-label="All Educational Games">
        <h2 class="library-header">ALL GAMES LIBRARY (<span id="total-games-count">4</span>)</h2>
        <div id="game-grid"></div>
      </section>
    </main>

    <!-- Active Mini-Game Stage -->
    <section id="stage-view" aria-live="polite">
      <div class="parent-gate-corner left" id="gate-left" title="Hold top corner for 2s to exit">
        <svg class="gate-ring" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="24" fill="#1e293b" opacity="0.6" />
          <circle id="gate-progress-left" cx="32" cy="32" r="24" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="150.8" stroke-dashoffset="150.8" transform="rotate(-90 32 32)" />
          <path d="M24 26 V22 A8 8 0 0 1 40 22 V26 M20 26 H44 V44 H20 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="parent-gate-corner right" id="gate-right" title="Hold top corner for 2s to exit">
        <svg class="gate-ring" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="24" fill="#1e293b" opacity="0.6" />
          <circle id="gate-progress-right" cx="32" cy="32" r="24" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="150.8" stroke-dashoffset="150.8" transform="rotate(-90 32 32)" />
          <path d="M24 26 V22 A8 8 0 0 1 40 22 V26 M20 26 H44 V44 H20 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
        </svg>
      </div>
      <div id="parent-gate-hint">Hold top corner for 2 seconds to exit to menu</div>
      <div id="game-mount"></div>
    </section>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
