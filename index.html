<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kids Commons" />
  <title>Zero-Telemetry Kids — Offline Preschool Commons</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg-sky: #f0f9ff;
      --bg-card: #ffffff;
      --ink-primary: #0f172a;
      --ink-muted: #475569;
      --barn-red: #dc2626;
      --tractor-green: #16a34a;
      --sun-amber: #f59e0b;
      --sky-blue: #2563eb;
      --plum-purple: #7c3aed;
      --border-soft: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-sky);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink-primary);
    }

    #app-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* OS-Aware Parent Install Banner */
    #install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.95rem;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    #install-banner.visible {
      display: flex;
    }

    .install-btn {
      background: var(--tractor-green);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .install-dismiss {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Launcher View */
    #launcher-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-y: auto;
      touch-action: pan-y;
    }

    .launcher-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .launcher-header h1 {
      margin: 0 0 6px 0;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      color: var(--ink-primary);
    }

    .launcher-header p {
      margin: 0;
      font-size: 1rem;
      color: var(--ink-muted);
    }

    #game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 980px;
    }

    .game-card {
      min-height: 200px;
      background: var(--bg-card);
      border: 4px solid var(--border-soft);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .game-card:active {
      transform: scale(0.96);
    }

    .game-card-icon {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-card-title {
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
      color: var(--ink-primary);
    }

    /* Active Game Stage */
    #stage-view {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #stage-view.active {
      display: block;
    }

    #game-mount {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Dual-Corner Parent Gate Zones (96x96px minimum hitbox) */
    .parent-gate-corner {
      position: fixed;
      top: 0;
      width: 96px;
      height: 96px;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }

    .parent-gate-corner.left {
      left: 0;
    }

    .parent-gate-corner.right {
      right: 0;
    }

    .parent-gate-corner.holding {
      opacity: 1;
    }

    .gate-ring {
      width: 56px;
      height: 56px;
    }

    #parent-gate-hint {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 910;
    }

    #parent-gate-hint.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <!-- Smart OS-Aware Parent Install Banner -->
    <div id="install-banner" role="region" aria-label="Install App Prompt"></div>

    <!-- Main Game Launcher Grid -->
    <main id="launcher-view">
      <header class="launcher-header">
        <h1>Zero-Telemetry Kids</h1>
        <p>Tap a picture to play! (Parents: Hold both top corners for 2 seconds inside any game to exit)</p>
      </header>
      <section id="game-grid" aria-label="Educational Games"></section>
    </main>

    <!-- Active Mini-Game Stage -->
    <section id="stage-view" aria-live="polite">
      <div class="parent-gate-corner left" id="gate-left" title="Hold both top corners for 2s to exit">
        <svg class="gate-ring" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="24" fill="#1e293b" opacity="0.6" />
          <circle id="gate-progress-left" cx="32" cy="32" r="24" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="150.8" stroke-dashoffset="150.8" transform="rotate(-90 32 32)" />
          <path d="M24 26 V22 A8 8 0 0 1 40 22 V26 M20 26 H44 V44 H20 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="parent-gate-corner right" id="gate-right" title="Hold both top corners for 2s to exit">
        <svg class="gate-ring" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="24" fill="#1e293b" opacity="0.6" />
          <circle id="gate-progress-right" cx="32" cy="32" r="24" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="150.8" stroke-dashoffset="150.8" transform="rotate(-90 32 32)" />
          <path d="M24 26 V22 A8 8 0 0 1 40 22 V26 M20 26 H44 V44 H20 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
        </svg>
      </div>
      <div id="parent-gate-hint">Parents: Hold BOTH top corners for 2 seconds to exit to menu</div>
      <div id="game-mount"></div>
    </section>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
